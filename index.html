<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Self-Love Bullet Journal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Self-Care Bullet Journal</h1>
      <section class="journal-section" id="calendar-view">
        <h2>My Bullets This Month</h2>
        <div id="calendar-body">
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
          <div class="day"></div>
        </div>
      </section>
      <section class="journal-section" id="bullet-form">
        <h2>Add a Bullet</h2>
        <label for="exercised">
          <input
            type="checkbox"
            name="task"
            id="exercised"
            class="task-input"
          />Exercised
        </label>
        <label for="drank-water">
          <input
            type="checkbox"
            name="task"
            id="drank-water"
            class="task-input"
          />Drank Water
        </label>
        <label for="meditated">
          <input
            type="checkbox"
            name="task"
            id="meditated"
            class="task-input"
          />Meditated
        </label>
        <label for="took-break">
          <input
            type="checkbox"
            name="task"
            id="took-break"
            class="task-input"
          />Took a Break
        </label>
        <label for="cooked-meal">
          <input
            type="checkbox"
            name="task"
            id="cooked-meal"
            class="task-input"
          />Cooked a Meal
        </label>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
